# Orquestrador de deploy — site pessoal (gabrielbrsousa.dev).
# Colocar em <raiz-do-projeto-angular>/deploy/iac.toml

[remote]
host    = "192.168.15.200"
user    = "gabrielsousa"
port    = 22
workdir = "/tmp/iac-personal-home-page"

[k8s]
namespace       = "site-pessoal"
deployment      = "site-pessoal"
container       = ""                       # vazio = autodetecta via kubectl
ingress_host    = "gabrielbrsousa.dev"     # host usado pelo verify
ingress_hosts   = ["gabrielbrsousa.dev"]
rollout_timeout = 180
verify_paths    = ["/", "/en", "/en/", "/robots.txt", "/sitemap.xml"]
verify_tries    = 3
verify_contains = "<app-root"              # trecho obrigatório na home

[build]
mode       = "artifact"
command    = ["npm", "run", "build"]
# CONFIRA no angular.json: o caminho usa o nome do PROJETO, não o da pasta.
dist       = "dist/personal-home-page/browser"
dockerfile = "deploy/Dockerfile.runtime"
nginx_conf = "deploy/nginx.conf"

[image]
repository    = "local/personal-home-page-frontend"
keep          = 5
containerd_ns = "k8s.io"

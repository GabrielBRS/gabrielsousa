server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Sonda do HEALTHCHECK do Dockerfile.runtime (wget /healthz a cada 30s).
    # Sem esta location a sonda cairia no fallback e baixaria o index inteiro.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok";
    }

    # Rotas prerenderizadas: / -> /index.html, /en -> /en/index.html.
    # Qualquer outra URL cai no index raiz (o redirect '**' do Angular resolve).
    location / {
        try_files $uri $uri/index.html /index.html;
    }

    # Chunks com hash no nome: cache agressivo e imutável
    location ~* \.(?:js|css|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # HTML nunca deve ser cacheado agressivamente (deploy novo = conteúdo novo)
    location ~* \.html$ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 512;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
